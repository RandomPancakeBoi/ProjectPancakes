    <main>
        <div class="form-container">
            <h1>My Simple Contact Form</h1>
            <form id="emailForm" action="https://api.web3forms.com/submit" method="POST">
                <input type="hidden" name="access_key" value="0538e631-2d71-4b7a-b39a-387e788b149e">
                <div class="form-row">
                    <div class="input-group">
                        <input type="text" id="name" name="name" placeholder="Your Preferred Name" required>
                    </div>
                </div>
        
                <div class="input-group">
                    <label class="pcmethod" for="options">Preferred Contact Method</label>
                    <div class="Toggles">
                        <label class="Title" for="contactByPhone">Phone:</label>
                        <input type="radio" id="contactByPhone" name="contactMethod" value="Phone" onchange="toggleContactInputs()">
                        <label class="Title" for="contactByEmail">Email:</label>
                        <input type="radio" id="contactByEmail" name="contactMethod" value="Email" onchange="toggleContactInputs()">
                    </div>
                </div>
        
                <div class="input-group email" id="emailInput" style="display:none;">
                    <input type="email" id="email" name="email" placeholder="Your Email Address">
                </div>
        
                <div class="input-group number" id="phoneInput" style="display:none;">
                    <input type="tel" id="pnumber" name="phone" placeholder="Your Phone Number">
                </div>
        
                <div class="input-group">
                    <textarea id="details" name="message" rows="4" placeholder="What is your question?" required></textarea>
                </div>
        
                <div class="input-group">
                    <label for="fileUpload">Upload Image (Optional)</label>
                    <input type="file" id="fileUpload" accept="image/png, image/jpeg">
                </div>
        
                <button type="submit" id="submitButton" class="submitContacts" disabled>Submit Enquiry</button>
            </form>
        </div>
        
    </main>
